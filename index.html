    {label:tn.vac?"Credit n/a (vacant)*":tn.name+"*",v:tn.v,tag:tn.tag},

function makeDeals(seed){
  var r=rng(seed);var markets=MARKETS.slice();
  for(var i=markets.length-1;i>0;i--){var j=Math.floor(r()*(i+1));var tmp=markets[i];markets[i]=markets[j];markets[j]=tmp;}
  var notes=NOTES.slice().sort(function(){return r()-0.5;});
  var deals=[],seen={},vacUsed=false;
  for(i=0;i<ROUNDS;i++){
    var d=null;
    for(var k=0;k<40;k++){d=makeDeal(r,markets[i],pick(r,PRODUCTS),!vacUsed);var key=d.product+"|"+d.cls+"|"+(d.vacant?"V":"L");if(!seen[key]){seen[key]=1;break;}}
    if(d.vacant)vacUsed=true;d.note=notes[i%notes.length];
    if(d.vacant&&/Tenant|rollover/.test(d.note))d.note="Broker note: 'Lease-up in 6 months.' Sure.";
    deals.push(d);
  }
  return deals;
}
function whyLine(d){
  var big=d.adjs.filter(function(a){return a.tag&&Math.abs(a.v)>=10;}).slice().sort(function(a,b){return Math.abs(b.v)-Math.abs(a.v);}).slice(0,3);
  var wide=big.filter(function(a){return a.v>0;}).map(function(a){return a.tag;}).slice(0,2);
  var tight=big.filter(function(a){return a.v<0;}).map(function(a){return a.tag;}).slice(0,2);
  var s=[];
  if(wide.length)s.push(cap1(wide.join(" and "))+" pushed it wide.");
  if(tight.length)s.push(cap1(tight.join(" and "))+(wide.length?" pulled it back in.":" tightened it."));
  if(!s.length)s.push("Close to the market base. Not much going on.");
  return s.join(" ");
}
function cap1(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function quipFor(off,dir,answer,r,lolUsed){
  // dir<0: guess below the model cap = priced too rich (overpaid). dir>0: guess above = too wide (lose the deal).
  var om=pct(Math.max(MIN,answer-75)).replace("%","");var pool;
  if(off===0)pool=["Exact. Pin drop. Lfg!","Zero bps. Are you the seller? IYKYK."];
  else if(off<=10)pool=["Inside a rounding error. Lfg!","That's a handshake deal. Had been a while!","Tight. Somebody actually reads rent rolls."];
  else if(off<=25)pool=dir<0?["A hair rich. Still makes best and final.","Slightly rich. Seller is smiling, IC is fine."]:["A hair wide. Still makes best and final.","Slightly wide. Inside the bid-ask. Respect."];
  else if(off<=50)pool=dir<0?["A little rich. IC will have questions.","Bid-ask spread energy. Seller loved you."]:["Bid-ask spread energy. Seller wanted tighter.","Lowballed it. Classic LOI."];
  else if(off<=100)pool=dir<0?["Broker OM said "+om+". Lol. You believed it.","Broker OM said "+om+". You believed it.","You'd win the bid and own the loss."]:["Retrade-happy. You'd lose the deal.","UST moved while you were underwriting. Sure.","Seller took the other LOI. Respectfully."];
  else pool=dir<0?["Paying 2021 money for a 2026 deal. Bold.","You underwrote 5% rent growth forever. IYKYK.","You'd win the bid and own the loss. Lfg?"]:["Lowball LOI. Seller stopped returning calls.","Pricing it like it's 2009. Seller hung up.","Retrade-happy. You'd lose this one by a mile."];
  if(lolUsed)pool=pool.filter(function(q){return q.indexOf("Lol")<0;});
  return pool[Math.floor(r()*pool.length)];
}

  var text=shareText();
  function setBtn(t){var cb=document.querySelector("[data-testid=copy]");if(cb)cb.textContent=t;}
  function ok(){S.btnCopied=true;S.copied="";var m=document.querySelector("[data-testid=copied]");if(m)m.remove();setBtn("Copied");clearTimeout(copyTimer);copyTimer=setTimeout(function(){S.btnCopied=false;setBtn("Copy result");},2000);}
  function blocked(){S.copied="Copy blocked here. Select the text above.";render(false);}
  function fallback(){
    try{var ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.top="0";ta.style.left="0";ta.style.opacity="0";ta.style.fontSize="16px";document.body.appendChild(ta);
      var range=document.createRange();range.selectNodeContents(ta);var sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);ta.setSelectionRange(0,text.length);
      var res=document.execCommand("copy");document.body.removeChild(ta);if(res)ok();else blocked();}
    catch(e){blocked();}
  }
  if(navigator.clipboard&&window.isSecureContext&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,fallback);}else fallback();
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var act=b.getAttribute("data-act"),n=b.getAttribute("data-nudge");
  if(n!==null){S.guess=Math.min(MAX,Math.max(MIN,S.guess+Number(n)));var sl=document.getElementById("slider");if(sl)sl.value=S.guess;document.getElementById("guessVal").textContent=pct(S.guess);return;}
  if(act==="start")start();else if(act==="peek"){S.showModel=!S.showModel;render(false);}
  else if(act==="math"){S.showMath=!S.showMath;var bk=document.querySelector("[data-testid=breakdown]");if(bk)bk.hidden=!S.showMath;b.textContent=S.showMath?"Hide the math":"Show the math";b.setAttribute("aria-expanded",String(S.showMath));}
  else if(act==="lock"&&S.phase==="play")lock();else if(act==="next"&&S.phase==="reveal"&&S.done)next();
  else if(act==="copy")copy();else if(act==="again")again();
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&!(e.target&&e.target.closest&&e.target.closest("button"))){if(S.phase==="play")lock();else if(S.phase==="reveal"&&S.done)next();}});
window.__crc=S;window.__crcFns={makeDeals:makeDeals,rankIdx:rankIdx};
render(false);
})();
</script>
